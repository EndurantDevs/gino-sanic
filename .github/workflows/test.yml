name: test

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  test:
    runs-on: ubuntu-latest
    container: python:${{ matrix.python-version }}-bullseye
    strategy:
      matrix:
        python-version: [ '3.6', '3.7', '3.8' ]
        postgres-version: [ '9.6', '12.1' ]
    services:
      postgres:
        image: fantix/postgres-ssl:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: gino
        ports:
        - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - name: Checkout source code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: virtualenv cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/pypoetry/virtualenvs
        key: ${{ runner.os }}-bullseye-${{ matrix.python-version }}-poetry-1.1.15-setuptools-59.6.0-${{ hashFiles(format('{0}{1}', github.workspace, '/poetry.lock')) }}
        restore-keys: |
          ${{ runner.os }}-bullseye-${{ matrix.python-version }}-poetry-1.1.15-setuptools-59.6.0-
    - name: Install Python dependencies
      run: |
        python -m pip install poetry==1.1.15
        poetry run python -m pip install setuptools==59.6.0
        poetry install
    - name: Test with pytest
      env:
        DB_HOST: postgres
        DB_USER: gino
      run: |
        poetry run pytest --cov=src --cov=examples --cov-fail-under=95 --cov-report xml
    - name: Check code format with black
      if: matrix.python-version >= '3.6'
      run: |
          poetry run black --check src
    - name: Submit coverage report
      if: matrix.python-version == '3.8' && matrix.postgres-version == '12.1' && github.ref == 'refs/heads/master'
      env:
        CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_TOKEN }}
      run: |
        pip install codacy-coverage
        python-codacy-coverage -r coverage.xml
  release:
    runs-on: ubuntu-latest
    container: python:${{ matrix.python-version }}-bullseye
    needs: test
    strategy:
      matrix:
        python-version: [ '3.8' ]
    steps:
      - name: Checkout source code
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: virtualenv cache
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-bullseye-${{ matrix.python-version }}-poetry-1.1.15-setuptools-59.6.0-${{ hashFiles(format('{0}{1}', github.workspace, '/poetry.lock')) }}
          restore-keys: |
            ${{ runner.os }}-bullseye-${{ matrix.python-version }}-poetry-1.1.15-setuptools-59.6.0-
      - name: Release to PyPI
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install poetry==1.1.15
          poetry run python -m pip install setuptools==59.6.0
          poetry install
          poetry build
          poetry publish --username __token__ --password ${{ secrets.PYPI_TOKEN }}
